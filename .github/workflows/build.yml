name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q PairHelper.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
        working-directory: PairHelper
      - uses: actions/upload-artifact@v4
        with:
          name: PairHelper-apk
          path: PairHelper/app/build/outputs/apk/debug/*.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          files: PairHelper/app/build/outputs/apk/debug/*.apk
